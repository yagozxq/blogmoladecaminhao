<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molas Caminhão</title>
    <style>
       
        body {
            font-family: 'Times New Roman', Times, serif;
            background-color: #808080; /* Cinza */
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        header {
            background-color: #4B0082; /* Roxo */
            border: 3px solid #D4AF37; /* Dourado */
            color: #ffffff;
            text-align: center;
            padding: 30px 20px;
            margin-bottom: 30px;
        }

        header h1 {
            margin: 0 0 10px 0;
            font-size: 2.5rem;
            font-weight: bold;
        }

        header p {
            margin: 0;
            font-size: 1.1rem;
        }

        .post {
            color: #ffffff; /* Ajustado para dar leitura sobre o fundo cinza */
            line-height: 1.6;
        }

        .post h2 {
            color: #D4AF37; /* Dourado */
            font-size: 2rem;
            margin: 0 0 15px 0;
        }

        .post .author {
            color: #e0e0e0;
            font-size: 1.1rem;
            margin-bottom: 15px;
        }

        .post .content {
            font-size: 1.1rem;
            color: #ffffff;
        }

        img {
             width: 100px;
             height: 100px;
        }

    </style>
   
</head>
<body>

    <div class="container">

        <header>
            <h1>Molas Maninhao</h1>
            <p>As melhores molas e suspensões pesadas para o seu caminhão</p>
        </header>

 
        <article class="post">
            <img src="mola.png" alt="Logotipo da loja de molas: um feixe de molas reforçado de caminhão em destaque com acabamento metálico.">
            <h2>Linha Completa de Molas</h2>
            <div class="author">Por: Especialista em Suspensão</div>
            <p class="content">
                Trabalhamos com feixes de molas, lâminas adicionais e arqueamento para todas as marcas de caminhões pesados e carretas.
            </p>
        </article>
    </div>                       
</body>
</html>
